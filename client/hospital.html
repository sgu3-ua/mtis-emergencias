<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital - Cliente API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.ico" sizes="32x32">
</head>
<body>
    <main class="container">
        <h1>Hospital</h1>
        <p><a href="index.html">← Volver</a></p>

        <hr>

        <div>
            <label for="incidenteid">ID Incidente</label>
            <input type="number" id="incidenteid" name="incidenteid" value="1" min="1" required>

            <label for="lat">LAT</label>
            <input type="text" id="lat" name="lat" value="40.4168" required>

            <label for="lon">LON</label>
            <input type="text" id="lon" name="lon" value="-3.7038" required>

            <div>
                <a>Paciente</a>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="Juan Pérez" required>
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>

                <label for="alergias">Alergias</label>
                <input type="text" id="alergias" name="alergias" value="Alergia a penicilina" required>

                <label for="notas">Notas Médicas</label>
                <textarea id="notas" name="notas" rows="4" cols="50" required>Paciente con antecedentes de hipertensión.</textarea>
            </div>
            
            <div class="buttons">
                <button type="button" id="iniciarHospital">Iniciar Atención</button>
            </div>
    
        </div>

        <section id="result" aria-live="polite">
            <p class="muted">Interacciones con hospital aparecerán aquí.</p>
        </section>
    </main>

    <script src="bundle.js"></script>
</body>
</html>
