<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberos - Cliente API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bomberos</h1>
        <p><a href="index.html">← Volver</a></p>

        <hr>

        <div>
            <label for="incidenteid">ID Incidente</label>
            <input type="number" id="incidenteid" name="incidenteid" value="1" min="1" required>

            <label for="gravedad">Gravedad</label>
            <input type="text" id="gravedad" name="gravedad" required>

            <label for="vehiculosRequeridos">Vehículos Requeridos</label>
            <input type="text" id="vehiculosRequeridos" name="vehiculosRequeridos">
           
            <div class="buttons">
                <button type="button" id="llamadaBomberos">Llamada bomberos</button>
            </div>
    
        </div>

        <section id="result" aria-live="polite">
            <p class="muted">Interacciones con bomberos aparecerán aquí.</p>
        </section>
    </main>

    <script src="bundle.js"></script>
</body>
</html>
